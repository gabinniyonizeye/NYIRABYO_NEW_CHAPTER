<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#030712"/>

  <!-- Glow behind sun -->
  <radialGradient id="glow" cx="256" cy="300" r="180" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="100" fill="url(#glow)"/>

  <!-- Horizon line -->
  <line x1="80" y1="310" x2="432" y2="310" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Sun rays -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="256" y1="180" x2="256" y2="155"/>
    <line x1="296" y1="190" x2="312" y2="170"/>
    <line x1="323" y1="218" x2="345" y2="205"/>
    <line x1="216" y1="190" x2="200" y2="170"/>
    <line x1="189" y1="218" x2="167" y2="205"/>
    <line x1="330" y1="255" x2="355" y2="250"/>
    <line x1="182" y1="255" x2="157" y2="250"/>
  </g>

  <!-- Sun (half circle above horizon) -->
  <clipPath id="above">
    <rect x="0" y="0" width="512" height="310"/>
  </clipPath>
  <circle cx="256" cy="310" r="75" fill="#fbbf24" clip-path="url(#above)"/>

  <!-- Inner sun highlight -->
  <circle cx="256" cy="310" r="55" fill="#fde68a" clip-path="url(#above)" opacity="0.5"/>

  <!-- Text: NEW CHAPTER -->
  <text
    x="256" y="390"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="38"
    font-weight="700"
    fill="#fbbf24"
    text-anchor="middle"
    letter-spacing="2"
  >NEW CHAPTER</text>

  <!-- Tagline -->
  <text
    x="256" y="425"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="20"
    fill="#d97706"
    text-anchor="middle"
    letter-spacing="1"
    opacity="0.8"
  >NYIRABYO</text>
</svg>
